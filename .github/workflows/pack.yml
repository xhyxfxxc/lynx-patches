#
# Builds ONE third-party pack from packs/<name>/ and publishes it as its own Morphe source. Started by hand:
#
#   gh workflow run Pack -R xhyxfxxc/lynx-patches -f pack=<name>                 build, release, publish the source
#   gh workflow run Pack -R xhyxfxxc/lynx-patches -f pack=<name> -f publish=false  build and verify only
#
# Each pack has its own Gradle build (its own wrapper and toolchain), so it cannot share the root build. The
# release is tagged pack-<name>-v<version> and is never marked "latest", so the Lynx Patches releases that
# release.yml makes stay the latest one. Morphe Manager reads packs/<name>/patches-bundle.json, which this
# workflow writes after the release exists. Pack commits are chore(pack-<name>): ..., so release.yml ignores them.
#
# Two jobs, so that pack code never runs next to a write token:
#   build    runs the pack's own Gradle build (third-party scripts and plugins) with a read-only token, and
#            uploads the bundle as a workflow artifact.
#   publish  holds the write, attestation and OIDC permissions. It never runs Gradle and never executes anything
#            from packs/: it downloads the artifact, checks its sha256 against what the build job reported,
#            creates the release, pushes the bundle JSON and attests the file. Its token reaches only the
#            "gh release create" step and the git push step.
# Every value that comes from an input or from packs/packs.json reaches the scripts through env: and is quoted.

name: Pack

on:
  workflow_dispatch:
    inputs:
      pack:
        description: 'Pack name, the folder under packs/ (lowercase letters, digits and dashes)'
        required: true
        type: string
      publish:
        description: 'Publish a release and the Morphe source (false: build and verify only)'
        required: false
        type: boolean
        default: true

# Two pack runs never overlap: they would race on the bundle commit pushed to main.
concurrency:
  group: pack-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    # The publish job re-checks all of these against packs/packs.json and the sha256 against the downloaded file.
    outputs:
      pack: ${{ steps.entry.outputs.pack }}
      version: ${{ steps.entry.outputs.version }}
      title: ${{ steps.entry.outputs.title }}
      bundle: ${{ steps.bundle.outputs.name }}
      artifact: ${{ steps.bundle.outputs.artifact }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      # No stored credentials: the pack's build scripts run in this job and must not find a token in .git/config.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the pack entry
        id: entry
        env:
          PACK: ${{ inputs.pack }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          if [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            fail 'publishing is only allowed from main (run with publish=false from other branches)'
          fi
          [[ "$PACK" =~ ^[a-z0-9-]+$ ]] || fail 'the pack input must match ^[a-z0-9-]+$'
          packs=packs/packs.json
          field() { jq -r --arg p "$PACK" "$1" "$packs"; }
          jq -e --arg p "$PACK" '.packs[$p] | type == "object"' "$packs" > /dev/null \
            || fail "this pack is not listed in $packs"
          [ -f "packs/$PACK/gradlew" ] || fail "packs/$PACK/gradlew is missing: the pack is not imported yet"
          [ -f "packs/$PACK/gradle/wrapper/gradle-wrapper.jar" ] \
            || fail "packs/$PACK/gradle/wrapper/gradle-wrapper.jar is missing, so the wrapper cannot be validated"
          version=$(field '.packs[$p].version // ""')
          title=$(field '.packs[$p].title // ""')
          java=$(field '.packs[$p].build.java // ""')
          tasks=$(field '.packs[$p].build.tasks // ""')
          output=$(field '.packs[$p].build.output // ""')
          args=$(field '.packs[$p].build.args // ""')
          [ -n "$version" ] || fail "version is empty for this pack in $packs"
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]] \
            || fail 'version may only hold letters, digits and . _ + - (it becomes a tag and a file name)'
          [[ "$java" =~ ^[0-9]+$ ]] || fail 'build.java must be a number such as 21'
          [ -n "$tasks" ] || fail 'build.tasks is empty'
          [ -n "$output" ] || fail 'build.output is empty'
          glob_re='^[][A-Za-z0-9._/*?-]+$'
          [[ "$output" =~ $glob_re && "$output" != /* && "$output" != *..* ]] \
            || fail 'build.output must be a relative glob without spaces or ..'
          for value in "$title" "$tasks" "$args"; do
            case "$value" in *$'\n'*|*$'\r'*) fail 'title, build.tasks and build.args must be single lines' ;; esac
          done
          {
            echo "pack=$PACK"
            echo "version=$version"
            echo "title=${title:-$PACK}"
            echo "java=$java"
            echo "tasks=$tasks"
            echo "output=$output"
            echo "args=$args"
          } >> "$GITHUB_OUTPUT"

      # A release needs a new version: bump "version" in packs/packs.json first. The repo is public, so the
      # tag list can be read without a token.
      - name: Check the release tag is new
        if: ${{ inputs.publish }}
        env:
          PACK: ${{ steps.entry.outputs.pack }}
          VERSION: ${{ steps.entry.outputs.version }}
        run: |
          set -euo pipefail
          tag="pack-${PACK}-v${VERSION}"
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null || rc=$?
          case "$rc" in
            0) echo "::error::the tag ${tag} already exists: raise the version of this pack in packs/packs.json"; exit 1 ;;
            2) echo "tag ${tag} is free" ;;
            *) echo "::error::could not check the tags of this repository (git exit code ${rc})"; exit 1 ;;
          esac

      - name: Java ${{ steps.entry.outputs.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.entry.outputs.java }}

      # The action looks at every gradle-wrapper.jar in the checkout, so it covers packs/<name>/gradle/wrapper as
      # well as the root one. Two jars are expected: the root wrapper and the pack's own.
      - name: Validate the Gradle wrapper jars
        uses: gradle/actions/wrapper-validation@v6
        with:
          min-wrapper-count: 2

      # The pack resolves the Morphe Gradle plugin from GitHub Packages, exactly like the root build. The token of
      # this job can only read (contents: read, packages: read), which is all that needs.
      - name: Build the pack
        env:
          PACK: ${{ steps.entry.outputs.pack }}
          VERSION: ${{ steps.entry.outputs.version }}
          TASKS: ${{ steps.entry.outputs.tasks }}
          ARGS: ${{ steps.entry.outputs.args }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "packs/$PACK"
          chmod +x gradlew
          read -r -a task_list <<< "$TASKS"
          read -r -a extra_args <<< "$ARGS"
          ./gradlew "${task_list[@]}" "-Pversion=$VERSION" "${extra_args[@]}" --no-daemon

      - name: Locate and verify the bundle
        id: bundle
        env:
          PACK: ${{ steps.entry.outputs.pack }}
          VERSION: ${{ steps.entry.outputs.version }}
          OUTPUT: ${{ steps.entry.outputs.output }}
        run: |
          set -euo pipefail
          mapfile -t found < <(cd "packs/$PACK" && python3 -c 'import glob, sys; print("\n".join(sorted(glob.glob(sys.argv[1]))))' "$OUTPUT" | sed '/^$/d')
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::build.output must match exactly one file in packs/${PACK}, it matched ${#found[@]}"
            for f in "${found[@]}"; do echo "  matched: $f"; done
            echo "  every .mpp under the pack folder:"
            (cd "packs/$PACK" && find . -name '*.mpp' -not -path './.git/*' | sed 's/^/    /') || true
            exit 1
          fi
          bundle="packs/$PACK/${found[0]}"
          listing=$(unzip -Z1 "$bundle")
          grep -qx 'classes.dex' <<< "$listing" \
            || { echo "::error::the bundle has no classes.dex, so it holds no Android code"; exit 1; }
          grep -Eq '^extensions/.*[^/]$' <<< "$listing" \
            || { echo "::error::the bundle has no file under extensions/"; exit 1; }
          out_dir="$RUNNER_TEMP/pack-out"
          mkdir -p "$out_dir"
          name="lynx-${PACK}-${VERSION}.mpp"
          cp "$bundle" "$out_dir/$name"
          sha=$(sha256sum "$out_dir/$name" | cut -d' ' -f1)
          size=$(stat -c %s "$out_dir/$name")
          echo "bundle: ${found[0]}"
          echo "sha256: $sha"
          echo "size:   $size bytes"
          echo "Built \`$name\`: $size bytes, sha256 \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "path=$out_dir/$name"
            echo "name=$name"
            echo "artifact=lynx-${PACK}-${VERSION}"
            echo "sha256=$sha"
          } >> "$GITHUB_OUTPUT"

      # Always uploaded, so a publish=false run can be downloaded and tried on a phone before anything is released.
      - name: Upload the bundle as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error

  publish:
    name: Release and publish the source
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Needed for packs/packs.json, packs/<name>/LYNX.md and to commit the bundle JSON. No stored credentials:
      # the token is handed only to the two steps that need it (the release and the push).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The build job's outputs are only trusted after they match packs/packs.json at this same commit.
      - name: Check the build outputs
        env:
          PACK: ${{ needs.build.outputs.pack }}
          VERSION: ${{ needs.build.outputs.version }}
          TITLE: ${{ needs.build.outputs.title }}
          BUNDLE: ${{ needs.build.outputs.bundle }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$PACK" =~ ^[a-z0-9-]+$ ]] || fail 'the build job reported a pack name that is not allowed'
          [[ "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]] || fail 'the build job reported a version that is not allowed'
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || fail 'the build job reported no sha256'
          [ "$BUNDLE" = "lynx-${PACK}-${VERSION}.mpp" ] || fail 'the bundle name does not match the pack and version'
          [ "$ARTIFACT" = "lynx-${PACK}-${VERSION}" ] || fail 'the artifact name does not match the pack and version'
          packs=packs/packs.json
          jq -e --arg p "$PACK" '.packs[$p] | type == "object"' "$packs" > /dev/null \
            || fail "this pack is not listed in $packs"
          want_version=$(jq -r --arg p "$PACK" '.packs[$p].version // ""' "$packs")
          want_title=$(jq -r --arg p "$PACK" '.packs[$p].title // ""' "$packs")
          [ "$VERSION" = "$want_version" ] || fail "the built version differs from $packs"
          [ "$TITLE" = "${want_title:-$PACK}" ] || fail "the reported title differs from $packs"

      - name: Download the bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/pack-dl

      - name: Verify the downloaded bundle
        id: verify
        env:
          BUNDLE: ${{ needs.build.outputs.bundle }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          dir="$RUNNER_TEMP/pack-dl"
          file="$dir/$BUNDLE"
          [ -f "$file" ] || fail 'the downloaded artifact does not hold the bundle'
          [ "$(find "$dir" -type f | wc -l)" -eq 1 ] || fail 'the downloaded artifact holds more than the bundle'
          actual=$(sha256sum "$file" | cut -d' ' -f1)
          [ "$actual" = "$SHA256" ] || fail "sha256 of the downloaded bundle is ${actual}, the build job reported ${SHA256}"
          echo "sha256 matches: $actual"
          echo "path=$file" >> "$GITHUB_OUTPUT"

      # Only reads LYNX.md as text, never runs anything from packs/.
      - name: Prepare the release notes
        env:
          PACK: ${{ needs.build.outputs.pack }}
          VERSION: ${{ needs.build.outputs.version }}
          TITLE: ${{ needs.build.outputs.title }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/pack-notes.md"
          if [ -f "packs/$PACK/LYNX.md" ] && [ ! -L "packs/$PACK/LYNX.md" ]; then
            cp "packs/$PACK/LYNX.md" "$notes"
          else
            echo "Lynx build of ${TITLE} ${VERSION}. Source and changes: https://github.com/${GITHUB_REPOSITORY}/tree/main/packs/${PACK}" > "$notes"
          fi

      - name: Create the GitHub release
        env:
          PACK: ${{ needs.build.outputs.pack }}
          VERSION: ${{ needs.build.outputs.version }}
          TITLE: ${{ needs.build.outputs.title }}
          BUNDLE_PATH: ${{ steps.verify.outputs.path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="pack-${PACK}-v${VERSION}"
          # The tag points at the commit that was built, not at whatever main has moved to since.
          gh release create "$tag" "$BUNDLE_PATH" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --latest=false --title "${TITLE} ${VERSION}" --notes-file "$RUNNER_TEMP/pack-notes.md"

      # The file Morphe Manager reads. Only this workflow writes it: the import filter keeps upstream's own
      # patches-bundle.json out of packs/<name>/, so Manager can never serve someone else's binary from our URL.
      - name: Write the bundle JSON and commit it
        id: commit
        env:
          PACK: ${{ needs.build.outputs.pack }}
          VERSION: ${{ needs.build.outputs.version }}
          GIT_AUTHOR_NAME: xhyxfxxc
          GIT_AUTHOR_EMAIL: 338141297+xhyxfxxc@users.noreply.github.com
          GIT_COMMITTER_NAME: xhyxfxxc
          GIT_COMMITTER_EMAIL: 338141297+xhyxfxxc@users.noreply.github.com
        run: |
          set -euo pipefail
          tag="pack-${PACK}-v${VERSION}"
          description=$(cat "$RUNNER_TEMP/pack-notes.md")
          jq -n \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%S)" \
            --arg description "$description" \
            --arg download_url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/lynx-${PACK}-${VERSION}.mpp" \
            --arg version "$VERSION" \
            '{created_at: $created_at, description: $description, download_url: $download_url, signature_download_url: "", version: $version}' \
            > "packs/$PACK/patches-bundle.json"
          cat "packs/$PACK/patches-bundle.json"
          git add "packs/$PACK/patches-bundle.json"
          if git diff --cached --quiet; then
            echo "the bundle JSON did not change, nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(pack-${PACK}): release ${VERSION} [skip ci]"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The token goes to git as an HTTP header for this step only, so it is never written to .git/config.
      - name: Push the bundle JSON to main
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          PACK: ${{ needs.build.outputs.pack }}
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: xhyxfxxc
          GIT_AUTHOR_EMAIL: 338141297+xhyxfxxc@users.noreply.github.com
          GIT_COMMITTER_NAME: xhyxfxxc
          GIT_COMMITTER_EMAIL: 338141297+xhyxfxxc@users.noreply.github.com
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "push rejected (attempt ${attempt} of 3): rebasing on main and trying again"
            git pull --rebase origin main
          done
          if [ "$pushed" != true ]; then
            echo "::error::the release pack-${PACK}-v${VERSION} exists but packs/${PACK}/patches-bundle.json could not be pushed; commit it by hand"
            exit 1
          fi

      - name: Attach build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Lynx pack ${{ needs.build.outputs.pack }} ${{ needs.build.outputs.version }}'
          subject-path: ${{ steps.verify.outputs.path }}
